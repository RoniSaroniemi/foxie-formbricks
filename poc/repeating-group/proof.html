<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repeating Group Proof</title>
    <link rel="stylesheet" href="../../packages/surveys/dist/index.css" />
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #111827;
      }

      .shell {
        max-width: 760px;
        margin: 0 auto;
      }

      .card {
        border: 1px solid #d1d5db;
        border-radius: 16px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      }

      #survey-container {
        min-height: 420px;
      }

      #response-log {
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        background: #111827;
        color: #d1fae5;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>Repeating Group Proof</h1>
        <p>This page simulates the portal-shell-hydrated target payload used for Phase B integration.</p>
        <div id="survey-container" data-testid="survey-container"></div>
      </div>

      <pre id="response-log" data-testid="response-log">Waiting for survey events...</pre>
    </div>

    <script src="../../packages/surveys/dist/index.umd.cjs"></script>
    <script src="./survey-fixture.js"></script>
  </body>
</html>
